<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
  <h2>Account Management</h2>

  <input id="fullName" placeholder="Full Name">
  <input id="email" placeholder="Email Address">
  <input id="phone" placeholder="WhatsApp Number">
  <input id="broker" placeholder="Broker Name">
  <input id="server" placeholder="MT5 Server">
  <input id="mt5" placeholder="MT5 Account Number">
  <input id="balance" placeholder="Account Balance (USD)">

  <button class="start-btn" onclick="submitAccount()">Submit Account</button>
</div>

<script src="script.js"></script>
</body>
</html>
