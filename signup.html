<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOREX AI - Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h1>FOREX AI</h1>
    <p>Create your FOREX AI account</p>

    <input id="name" type="text" placeholder="Full Name">
    <input id="email" type="email" placeholder="Email Address">
    <input id="phone" type="tel" placeholder="WhatsApp Number">

    <select id="country">
      <option value="">Select Country</option>
      <option>Uganda</option>
      <option>Kenya</option>
      <option>Tanzania</option>
      <option>Rwanda</option>
      <option>Nigeria</option>
    </select>

    <input id="password" type="password" placeholder="Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button type="button" class="start-btn" onclick="signUp()">Create Account</button>

    <p><a href="login.html">Already have an account? Login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
