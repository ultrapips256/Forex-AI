<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOREX AI - Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
  <h1 style="color:#00ff99;">FOREX AI</h1>
  <p>Join thousands of traders using AI-powered trading tools.</p>

  <input id="name" type="text" placeholder="👤 Full Name">

  <input id="email" type="email" placeholder="📧 Email Address">

  <input id="phone" type="tel" placeholder="📱 WhatsApp Number">

  <select id="country">
    <option value="">🌍 Select Country</option>
    <option>Uganda</option>
    <option>Kenya</option>
    <option>Tanzania</option>
    <option>Rwanda</option>
    <option>Nigeria</option>
    <option>South Africa</option>
  </select>

  <div class="password-box">
    <input id="password" type="password" placeholder="🔒 Create Password">
    <button type="button" onclick="togglePassword('password')">👁️</button>
  </div>

  <div class="password-box">
    <input id="confirmPassword" type="password" placeholder="🔐 Confirm Password">
    <button type="button" onclick="togglePassword('confirmPassword')">👁️</button>
  </div>

  <label style="color:white;">
    <input type="checkbox" id="terms">
    I agree to FOREX AI Terms & Risk Disclaimer.
  </label>

  <button type="button" class="start-btn" onclick="signUp()">
  🚀 Create Account
</button>

  <p style="margin-top:20px;">
    Already have an account?
    <a href="login.html" style="color:#00ff99;">Login</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="script.js"></script>

</body>
</html>
