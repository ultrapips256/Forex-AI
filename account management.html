<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Management | FOREX AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <h1>FOREX AI</h1>
  <a href="dashboard.html" class="login-btn">Dashboard</a>
</header>

<div class="form-container">
  <h2>Account Management</h2>
  <p><b>Profit Split:</b> Client keeps 60% • FOREX AI takes 40%.</p>

  <input type="text" placeholder="Full Name">
  <input type="email" placeholder="Email Address">
  <input type="tel" placeholder="WhatsApp Number">
  <input type="text" placeholder="Country">
  <input type="text" placeholder="Broker Name">
  <input type="number" placeholder="MT5 Account Number">
  <input type="password" placeholder="MT5 Investor Password">
  <input type="number" placeholder="Account Balance (USD)">

  <label style="color:white;">
    <input type="checkbox">
    I agree to the 60/40 profit-sharing agreement.
  </label>

  <button class="start-btn" onclick="submitAccount()">
    Submit Account
  </button>
</div>

<script src="script.js"></script>
</body>
</html>
